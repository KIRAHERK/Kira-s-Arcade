<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7ec8e3">
<title>Grumpy Birds 😡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #7ec8e3; }
  body { font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }

  .hud {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 12px; right: 12px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 5;
    color: #fff;
    font-weight: 800;
    text-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  .hud .score { font-size: 24px; }
  .hud .right { text-align: right; font-size: 15px; line-height: 1.5; }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(20, 30, 40, 0.55);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .panel {
    width: min(88vw, 340px);
    background: linear-gradient(180deg, #fff8e8, #ffe9c4);
    border: 3px solid #8a5a2b;
    border-radius: 22px;
    padding: 26px 22px;
    text-align: center;
    color: #4a2f12;
    box-shadow: 0 16px 50px rgba(0,0,0,.45);
    animation: pop .35s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .panel h1 { font-size: 28px; letter-spacing: 1px; margin-bottom: 6px; color: #c0392b; }
  .panel .tag { font-size: 13.5px; opacity: .85; margin-bottom: 18px; line-height: 1.6; }
  .panel .result { font-size: 15px; margin-bottom: 16px; line-height: 1.8; }
  .panel .result b { color: #c0392b; font-size: 28px; }
  .stars { font-size: 36px; letter-spacing: 4px; margin-bottom: 6px; }
  .newbest { color: #1f9c5b; font-weight: 800; }
  .big-btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    font-size: 18px; font-weight: 800; letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(180deg, #ff7a5c, #e74c3c 55%, #b02a1c);
    box-shadow: 0 5px 0 #7a1d12;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a1d12; }
  .links { margin-top: 14px; font-size: 13px; }
  .links a { color: #8a5a2b; text-decoration: underline; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
  <div class="score" id="scoreEl">0</div>
  <div class="right">
    <div id="levelEl">LEVEL 1</div>
    <div id="birdsEl">😡😡😡</div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>😡 GRUMPY BIRDS</h1>
    <div class="tag">Drag the bird back on the slingshot,<br>aim, and <b>let it rip</b>.<br>Squash every piggy 🐷 to clear the level!</div>
    <button class="big-btn" id="startBtn">PLAY</button>
    <div class="links">
      <a href="index.html">🎰 Slots</a> ·
      <a href="bird.html">🐦 Bird</a> ·
      <a href="stack.html">🏗️ Stack</a> ·
      <a href="2048.html">⚡ 2048</a>
    </div>
  </div>
</div>

<div class="overlay hidden" id="resultOverlay">
  <div class="panel">
    <div class="stars" id="starsEl"></div>
    <h1 id="resultTitle">LEVEL CLEARED!</h1>
    <div class="result">Score <b id="resultScore">0</b><div class="newbest hidden" id="newBest">★ NEW BEST! ★</div></div>
    <button class="big-btn" id="nextBtn">NEXT LEVEL ➜</button>
    <div class="links">
      <a href="index.html">🎰 Slots</a> ·
      <a href="bird.html">🐦 Bird</a> ·
      <a href="stack.html">🏗️ Stack</a> ·
      <a href="2048.html">⚡ 2048</a>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, scale = 1, offX = 0, offY = 0;

  // world units
  const GW = 800, GH = 520, GROUND = 470;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = Math.min(W / GW, H / GH);
    offX = (W - GW * scale) / 2;
    offY = H - GH * scale - Math.max(0, (H - GH * scale) * 0.25);
  }
  window.addEventListener("resize", resize);
  resize();
  const toWorld = (px, py) => [(px - offX) / scale, (py - offY) / scale];

  /* ---- audio ---- */
  let actx = null;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === "suspended") actx.resume();
  }
  function tone(f1, f2, dur, type, vol, when = 0) {
    if (!actx) return;
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    stretch: () => tone(180, 260, 0.08, "sine", 0.03),
    launch: () => tone(300, 900, 0.25, "sawtooth", 0.06),
    thud: (s) => tone(160 + s * 0.2, 60, 0.12, "square", Math.min(0.02 + s * 0.0002, 0.08)),
    crack: () => tone(900, 300, 0.1, "square", 0.06),
    oink: () => { tone(500, 300, 0.12, "square", 0.06); tone(700, 350, 0.14, "square", 0.04, 0.05); },
    win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.16, "triangle", 0.06, i * 0.1)),
    lose: () => [400, 330, 262, 196].forEach((f, i) => tone(f, f * 0.95, 0.2, "sine", 0.06, i * 0.14)),
  };
  const buzz = (p) => { if (navigator.vibrate) navigator.vibrate(p); };

  /* ---- state ---- */
  const SAVE_KEY = "grumpyBirdsBest_v1";
  let best = parseInt(localStorage.getItem(SAVE_KEY) || "0", 10) || 0;

  const SLING = { x: 120, y: GROUND - 75 };
  const BIRD_R = 15;
  const GRAV = 1050;

  let mode = "menu";   // menu | aim | fly | result
  let level = 1, score = 0, levelStartScore = 0;
  let birdsLeft = 0;
  let bird = null;     // {x,y,vx,vy,resting}
  let bodies = [];     // {x,y,w,h,vx,vy,type:'wood'|'stone'|'pig',hp,dead}
  let particles = [];
  let dragging = false, dragX = 0, dragY = 0;
  let settleTimer = 0, flyTimer = 0;
  let won = false;

  const hud = document.getElementById("hud");
  const scoreEl = document.getElementById("scoreEl"), levelEl = document.getElementById("levelEl"), birdsEl = document.getElementById("birdsEl");

  /* ---- levels ---- */
  const wood = (x, y, w, h) => ({ x, y, w, h, vx: 0, vy: 0, type: "wood", hp: 70 });
  const stone = (x, y, w, h) => ({ x, y, w, h, vx: 0, vy: 0, type: "stone", hp: 170 });
  const pig = (cx, yTop) => ({ x: cx - 16, y: yTop, w: 32, h: 32, vx: 0, vy: 0, type: "pig", hp: 30 });

  function towerAt(x, h2, withRoof, pigInside) {
    const out = [];
    const colH = 80;
    out.push(wood(x, GROUND - colH, 16, colH));
    out.push(wood(x + 110, GROUND - colH, 16, colH));
    if (pigInside) out.push(pig(x + 63, GROUND - 32));
    if (withRoof) out.push(wood(x - 12, GROUND - colH - 16, 150, 16));
    if (h2) {
      out.push(wood(x + 18, GROUND - colH - 16 - 70, 14, 70));
      out.push(wood(x + 94, GROUND - colH - 16 - 70, 14, 70));
      out.push(wood(x + 6, GROUND - colH - 16 - 70 - 14, 114, 14));
      out.push(pig(x + 63, GROUND - colH - 16 - 32));
    }
    return out;
  }

  function buildLevel(n) {
    bodies = [];
    if (n === 1) {
      bodies.push(...towerAt(500, false, true, true));
      bodies.push(pig(700, GROUND - 32));
    } else if (n === 2) {
      bodies.push(...towerAt(440, false, true, true));
      bodies.push(...towerAt(640, false, true, true));
    } else if (n === 3) {
      bodies.push(stone(420, GROUND - 70, 18, 70));
      bodies.push(stone(540, GROUND - 70, 18, 70));
      bodies.push(stone(404, GROUND - 70 - 16, 170, 16));
      bodies.push(pig(490, GROUND - 32));
      bodies.push(...towerAt(620, true, true, true));
    } else {
      // procedural: 2-3 stacks, mixed materials
      const stacks = 2 + (n % 2);
      for (let i = 0; i < stacks; i++) {
        const x = 420 + i * (180 - Math.min(n * 4, 40));
        const mk = (n + i) % 3 === 2 ? stone : wood;
        const colH = 70 + ((n * 13 + i * 29) % 30);
        bodies.push(mk(x, GROUND - colH, 16, colH));
        bodies.push(mk(x + 100, GROUND - colH, 16, colH));
        bodies.push(mk(x - 10, GROUND - colH - 16, 136, 16));
        bodies.push(pig(x + 58, GROUND - 32));
        if ((n + i) % 2 === 0) bodies.push(pig(x + 58, GROUND - colH - 16 - 32));
      }
    }
    birdsLeft = pigsAlive() + 1;
    particles = [];
    won = false;
    loadBird();
  }

  function pigsAlive() { return bodies.filter((b) => b.type === "pig" && !b.dead).length; }

  function loadBird() {
    if (birdsLeft <= 0) { bird = null; return; }
    birdsLeft--;
    bird = { x: SLING.x, y: SLING.y, vx: 0, vy: 0, resting: false };
    mode = "aim";
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = "LEVEL " + level;
    birdsEl.textContent = "😡".repeat(Math.max(0, birdsLeft + (mode === "aim" || mode === "fly" ? 1 : 0))) || "—";
  }

  /* ---- particles ---- */
  function burst(x, y, color, n, spread) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * spread;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.7 + Math.random() * 0.4, color, r: 2 + Math.random() * 4 });
    }
  }

  /* ---- physics ---- */
  function damage(b, dmg) {
    if (b.dead || dmg <= 0) return;
    b.hp -= dmg;
    if (b.hp <= 0) {
      b.dead = true;
      if (b.type === "pig") {
        score += 500;
        sfx.oink(); buzz([30, 20, 60]);
        burst(b.x + b.w / 2, b.y + b.h / 2, "#5fd068", 16, 200);
      } else {
        score += 50;
        sfx.crack(); buzz(15);
        burst(b.x + b.w / 2, b.y + b.h / 2, b.type === "stone" ? "#9aa5ad" : "#c98c4a", 12, 150);
      }
      updateHud();
    }
  }

  function stepPhysics(dt) {
    // bird
    if (bird && mode === "fly") {
      bird.vy += GRAV * dt;
      bird.x += bird.vx * dt;
      bird.y += bird.vy * dt;
      // ground
      if (bird.y + BIRD_R > GROUND) {
        bird.y = GROUND - BIRD_R;
        if (Math.abs(bird.vy) > 60) sfx.thud(Math.abs(bird.vy));
        bird.vy *= -0.38;
        bird.vx *= 0.72;
      }
      // bodies
      for (const b of bodies) {
        if (b.dead) continue;
        const cx = Math.max(b.x, Math.min(bird.x, b.x + b.w));
        const cy = Math.max(b.y, Math.min(bird.y, b.y + b.h));
        const dx = bird.x - cx, dy = bird.y - cy;
        const d2 = dx * dx + dy * dy;
        if (d2 < BIRD_R * BIRD_R) {
          const speed = Math.hypot(bird.vx, bird.vy);
          // impact damage (pigs are squishier)
          damage(b, speed * (b.type === "pig" ? 0.35 : 0.22));
          if (speed > 80) { sfx.thud(speed); buzz(10); }
          // push the body
          if (!b.dead) {
            b.vx += bird.vx * 0.55;
            b.vy += bird.vy * 0.3 - 30;
          }
          // bounce the bird away
          const d = Math.sqrt(d2) || 1;
          const nx = dx / d, ny = dy / d;
          const vn = bird.vx * nx + bird.vy * ny;
          if (vn < 0) {
            bird.vx -= 1.4 * vn * nx;
            bird.vy -= 1.4 * vn * ny;
          }
          bird.vx *= 0.55; bird.vy *= 0.55;
          const pen = BIRD_R - d;
          bird.x += nx * pen; bird.y += ny * pen;
        }
      }
    }

    // bodies
    for (const b of bodies) {
      if (b.dead) continue;
      b.vy += GRAV * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      // ground
      if (b.y + b.h > GROUND) {
        const impact = b.vy;
        b.y = GROUND - b.h;
        if (impact > 230) damage(b, (impact - 230) * (b.type === "pig" ? 0.25 : 0.1));
        b.vy = impact > 100 ? -impact * 0.12 : 0;
        b.vx *= 0.6;
        if (Math.abs(b.vx) < 6) b.vx = 0;
      }
      if (b.x < -60 || b.x > GW + 60) b.dead = true;
    }

    // body-body collisions, a few iterations for stability
    for (let iter = 0; iter < 3; iter++) {
      for (let i = 0; i < bodies.length; i++) {
        const a = bodies[i];
        if (a.dead) continue;
        for (let j = i + 1; j < bodies.length; j++) {
          const b = bodies[j];
          if (b.dead) continue;
          const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
          const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
          if (ox <= 0 || oy <= 0) continue;
          const ma = a.w * a.h, mb = b.w * b.h;
          const ta = mb / (ma + mb), tb = ma / (ma + mb);
          if (oy < ox) {
            // vertical contact
            const sign = a.y < b.y ? 1 : -1;
            a.y -= oy * ta * sign;
            b.y += oy * tb * sign;
            const rel = (a.vy - b.vy) * sign;
            if (rel > 0) {
              const imp = rel;
              if (imp > 260) { damage(a, (imp - 260) * 0.08); damage(b, (imp - 260) * (b.type === "pig" || a.type === "pig" ? 0.3 : 0.08)); }
              a.vy -= imp * ta * sign;
              b.vy += imp * tb * sign;
            }
            // friction
            a.vx *= 0.92; b.vx *= 0.92;
          } else {
            const sign = a.x < b.x ? 1 : -1;
            a.x -= ox * ta * sign;
            b.x += ox * tb * sign;
            const rel = (a.vx - b.vx) * sign;
            if (rel > 0) {
              if (rel > 280) { damage(a, (rel - 280) * 0.08); damage(b, (rel - 280) * 0.12); }
              a.vx -= rel * ta * sign * 1.05;
              b.vx += rel * tb * sign * 1.05;
            }
          }
        }
      }
    }

    // particles
    for (const p of particles) {
      p.vy += 800 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
  }

  function everythingCalm() {
    if (bird && mode === "fly" && (Math.abs(bird.vx) > 14 || Math.abs(bird.vy) > 14) && bird.x > -40 && bird.x < GW + 40) return false;
    for (const b of bodies) {
      if (!b.dead && (Math.abs(b.vx) > 12 || Math.abs(b.vy) > 12)) return false;
    }
    return true;
  }

  function endTurn() {
    if (pigsAlive() === 0) {
      won = true;
      score += birdsLeft * 300;       // leftover bird bonus
      showResult(true);
    } else if (birdsLeft <= 0) {
      showResult(false);
    } else {
      loadBird();
    }
  }

  /* ---- input ---- */
  function pointerPos(e) { return toWorld(e.clientX, e.clientY); }
  window.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest(".panel")) return;
    ensureAudio();
    if (mode !== "aim" || !bird) return;
    const [wx, wy] = pointerPos(e);
    if (Math.hypot(wx - bird.x, wy - bird.y) < 70) {
      dragging = true;
      dragX = wx; dragY = wy;
    }
  });
  window.addEventListener("pointermove", (e) => {
    if (!dragging || mode !== "aim" || !bird) return;
    const [wx, wy] = pointerPos(e);
    let dx = wx - SLING.x, dy = wy - SLING.y;
    const d = Math.hypot(dx, dy);
    const MAXPULL = 95;
    if (d > MAXPULL) { dx *= MAXPULL / d; dy *= MAXPULL / d; }
    bird.x = SLING.x + dx;
    bird.y = SLING.y + dy;
    if (Math.random() < 0.1) sfx.stretch();
  });
  window.addEventListener("pointerup", () => {
    if (!dragging || mode !== "aim" || !bird) { dragging = false; return; }
    dragging = false;
    const dx = SLING.x - bird.x, dy = SLING.y - bird.y;
    const pull = Math.hypot(dx, dy);
    if (pull < 12) { bird.x = SLING.x; bird.y = SLING.y; return; }
    launch(dx * 8.6, dy * 8.6);
  });

  function launch(vx, vy) {
    if (!bird || mode !== "aim") return;
    bird.vx = vx; bird.vy = vy;
    mode = "fly";
    flyTimer = 0; settleTimer = 0;
    sfx.launch(); buzz(20);
    updateHud();
  }

  /* ---- drawing ---- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawBirdShape(x, y, r, angry) {
    ctx.fillStyle = "#e74c3c";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = "#c0392b";
    ctx.beginPath(); ctx.arc(x, y + r * 0.45, r * 0.75, 0, Math.PI); ctx.fill();
    // belly
    ctx.fillStyle = "#f5d7b2";
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.45, r * 0.55, r * 0.4, 0, 0, 7); ctx.fill();
    // eyes
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x + r * 0.3, y - r * 0.2, r * 0.28, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - r * 0.15, y - r * 0.2, r * 0.28, 0, 7); ctx.fill();
    ctx.fillStyle = "#1b1b1b";
    ctx.beginPath(); ctx.arc(x + r * 0.34, y - r * 0.18, r * 0.12, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - r * 0.1, y - r * 0.18, r * 0.12, 0, 7); ctx.fill();
    // angry brows
    ctx.strokeStyle = "#1b1b1b";
    ctx.lineWidth = r * 0.16;
    ctx.beginPath(); ctx.moveTo(x - r * 0.45, y - r * 0.6); ctx.lineTo(x + r * 0.05, y - r * 0.38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + r * 0.65, y - r * 0.62); ctx.lineTo(x + r * 0.12, y - r * 0.38); ctx.stroke();
    // beak
    ctx.fillStyle = "#f4a127";
    ctx.beginPath();
    ctx.moveTo(x + r * 0.05, y + r * 0.05);
    ctx.lineTo(x + r * 0.75, y + r * 0.18);
    ctx.lineTo(x + r * 0.1, y + r * 0.4);
    ctx.closePath(); ctx.fill();
  }
  function drawPig(b) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2, r = b.w / 2;
    ctx.fillStyle = "#5fd068";
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.fillStyle = "#46a14e";
    ctx.beginPath(); ctx.arc(cx, cy + r * 0.5, r * 0.7, 0, Math.PI); ctx.fill();
    // ears
    ctx.fillStyle = "#5fd068";
    ctx.beginPath(); ctx.arc(cx - r * 0.55, cy - r * 0.75, r * 0.22, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.55, cy - r * 0.75, r * 0.22, 0, 7); ctx.fill();
    // eyes
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cx - r * 0.42, cy - r * 0.25, r * 0.2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.42, cy - r * 0.25, r * 0.2, 0, 7); ctx.fill();
    ctx.fillStyle = "#1b1b1b";
    ctx.beginPath(); ctx.arc(cx - r * 0.4, cy - r * 0.22, r * 0.09, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.44, cy - r * 0.22, r * 0.09, 0, 7); ctx.fill();
    // snout
    ctx.fillStyle = "#7ee487";
    rr(cx - r * 0.35, cy - r * 0.05, r * 0.7, r * 0.5, r * 0.2); ctx.fill();
    ctx.fillStyle = "#2f7a36";
    ctx.beginPath(); ctx.arc(cx - r * 0.15, cy + r * 0.2, r * 0.07, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.15, cy + r * 0.2, r * 0.07, 0, 7); ctx.fill();
  }
  function drawBlock(b) {
    if (b.type === "stone") {
      ctx.fillStyle = "#9aa5ad";
      rr(b.x, b.y, b.w, b.h, 3); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.25)";
      ctx.lineWidth = 2;
      rr(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 3); ctx.stroke();
    } else {
      ctx.fillStyle = "#c98c4a";
      rr(b.x, b.y, b.w, b.h, 3); ctx.fill();
      ctx.strokeStyle = "rgba(90, 50, 10, .4)";
      ctx.lineWidth = 1.5;
      // wood grain
      if (b.w > b.h) {
        for (let gx = b.x + 14; gx < b.x + b.w - 4; gx += 18) {
          ctx.beginPath(); ctx.moveTo(gx, b.y + 2); ctx.lineTo(gx, b.y + b.h - 2); ctx.stroke();
        }
      } else {
        for (let gy = b.y + 14; gy < b.y + b.h - 4; gy += 18) {
          ctx.beginPath(); ctx.moveTo(b.x + 2, gy); ctx.lineTo(b.x + b.w - 2, gy); ctx.stroke();
        }
      }
    }
    // damage cracks
    if (b.hp < (b.type === "stone" ? 100 : 40)) {
      ctx.strokeStyle = "rgba(0,0,0,.45)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x + b.w * 0.3, b.y);
      ctx.lineTo(b.x + b.w * 0.5, b.y + b.h * 0.4);
      ctx.lineTo(b.x + b.w * 0.25, b.y + b.h * 0.7);
      ctx.stroke();
    }
  }

  function draw() {
    // sky
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#8fd3f4");
    g.addColorStop(0.7, "#bde8f7");
    g.addColorStop(1, "#d8f3e8");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(offX, offY);
    ctx.scale(scale, scale);

    // clouds
    ctx.fillStyle = "rgba(255,255,255,.8)";
    for (const [cx, cy, cr] of [[150, 90, 26], [420, 60, 32], [650, 110, 22]]) {
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, 7);
      ctx.arc(cx + cr * 0.9, cy + 6, cr * 0.75, 0, 7);
      ctx.arc(cx - cr * 0.9, cy + 6, cr * 0.7, 0, 7);
      ctx.fill();
    }
    // hills
    ctx.fillStyle = "#9fd98a";
    ctx.beginPath(); ctx.ellipse(180, GROUND + 30, 280, 70, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(620, GROUND + 40, 320, 80, 0, Math.PI, 0); ctx.fill();

    // slingshot back arm
    ctx.strokeStyle = "#7a4a22";
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(SLING.x + 8, SLING.y + 8); ctx.lineTo(SLING.x + 16, GROUND); ctx.stroke();

    // band (back) while aiming
    if (mode === "aim" && bird && dragging) {
      ctx.strokeStyle = "#5a3215";
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(SLING.x + 14, SLING.y); ctx.lineTo(bird.x, bird.y); ctx.stroke();
    }

    // trajectory preview
    if (mode === "aim" && bird && dragging) {
      const vx = (SLING.x - bird.x) * 8.6, vy = (SLING.y - bird.y) * 8.6;
      ctx.fillStyle = "rgba(255,255,255,.75)";
      let px = bird.x, py = bird.y, pvx = vx, pvy = vy;
      for (let i = 0; i < 18; i++) {
        const tdt = 0.05;
        pvy += GRAV * tdt;
        px += pvx * tdt; py += pvy * tdt;
        if (py > GROUND) break;
        ctx.beginPath(); ctx.arc(px, py, 3.4 - i * 0.12, 0, 7); ctx.fill();
      }
    }

    // bodies
    for (const b of bodies) {
      if (b.dead) continue;
      if (b.type === "pig") drawPig(b);
      else drawBlock(b);
    }

    // bird
    if (bird) drawBirdShape(bird.x, bird.y, BIRD_R, true);
    // waiting birds
    for (let i = 0; i < birdsLeft; i++) drawBirdShape(48 - i * 26, GROUND - 12, 11, true);

    // band (front) while aiming
    if (mode === "aim" && bird && dragging) {
      ctx.strokeStyle = "#7a4a22";
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(SLING.x - 12, SLING.y - 2); ctx.lineTo(bird.x, bird.y); ctx.stroke();
    }
    // slingshot front arm
    ctx.strokeStyle = "#8a5a2b";
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(SLING.x - 10, SLING.y); ctx.lineTo(SLING.x + 4, SLING.y + 30); ctx.lineTo(SLING.x + 12, GROUND); ctx.stroke();

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ground
    ctx.fillStyle = "#6cbf5a";
    ctx.fillRect(-40, GROUND, GW + 80, GH - GROUND + 60);
    ctx.fillStyle = "#4f9842";
    ctx.fillRect(-40, GROUND, GW + 80, 7);

    ctx.restore();
  }

  /* ---- main loop ---- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.04);
    last = now;

    if (mode === "fly" || mode === "aim") {
      // substep for stability
      const steps = 2;
      for (let s = 0; s < steps; s++) stepPhysics(dt / steps);

      if (mode === "fly") {
        flyTimer += dt;
        if (everythingCalm()) settleTimer += dt; else settleTimer = 0;
        if (settleTimer > 0.7 || flyTimer > 9 || (bird && (bird.x > GW + 40 || bird.x < -40))) {
          mode = "aim"; // pause physics state label while deciding
          endTurn();
        } else if (pigsAlive() === 0 && settleTimer > 0.2) {
          mode = "aim";
          endTurn();
        }
      }
    }

    draw();
    requestAnimationFrame(frame);
  }

  /* ---- flow ---- */
  function showResult(isWin) {
    mode = "result";
    if (isWin) { sfx.win(); buzz([50, 40, 50, 40, 120]); }
    else { sfx.lose(); buzz(160); }
    const stars = isWin ? (birdsLeft >= 2 ? "⭐⭐⭐" : birdsLeft === 1 ? "⭐⭐" : "⭐") : "💔";
    document.getElementById("starsEl").textContent = stars;
    document.getElementById("resultTitle").textContent = isWin ? "LEVEL CLEARED!" : "PIGGIES SURVIVED!";
    document.getElementById("resultScore").textContent = score;
    const nb = document.getElementById("newBest");
    if (score > best) { best = score; localStorage.setItem(SAVE_KEY, String(best)); nb.classList.remove("hidden"); }
    else nb.classList.add("hidden");
    document.getElementById("nextBtn").textContent = isWin ? "NEXT LEVEL ➜" : "RETRY LEVEL";
    document.getElementById("resultOverlay").classList.remove("hidden");
  }

  document.getElementById("startBtn").addEventListener("click", () => {
    ensureAudio();
    document.getElementById("menu").classList.add("hidden");
    hud.classList.remove("hidden");
    level = 1; score = 0; levelStartScore = 0;
    buildLevel(level);
    updateHud();
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    ensureAudio();
    document.getElementById("resultOverlay").classList.add("hidden");
    if (won) { level++; levelStartScore = score; }
    else { score = levelStartScore; }
    buildLevel(level);
    updateHud();
  });

  requestAnimationFrame(frame);

  // debug/testing hook
  window.__angry = {
    get mode() { return mode; },
    get bodies() { return bodies; },
    get bird() { return bird; },
    get birdsLeft() { return birdsLeft; },
    get score() { return score; },
    get level() { return level; },
    get won() { return won; },
    pigsAlive, launch, buildLevel,
    placeBird(x, y) { if (bird) { bird.x = x; bird.y = y; } },
  };
})();
</script>
</body>
</html>
