<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#160b2e">
<title>Brick Blast 🧱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #160b2e; }
  body { font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }

  .hud {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 14px; right: 14px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 5;
    color: #fff;
    font-weight: 800;
    text-shadow: 0 2px 8px rgba(0,0,0,.55);
  }
  .hud .score { font-size: 26px; }
  .hud .right { text-align: right; font-size: 15px; line-height: 1.5; }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(10, 5, 25, 0.65);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .panel {
    width: min(88vw, 340px);
    background: linear-gradient(180deg, #2c1654, #180c33);
    border: 1px solid rgba(255, 140, 92, .6);
    border-radius: 22px;
    padding: 26px 22px;
    text-align: center;
    color: #fff;
    box-shadow: 0 16px 50px rgba(0,0,0,.55), 0 0 40px rgba(255,140,92,.12);
    animation: pop .35s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .panel h1 {
    font-size: 30px; letter-spacing: 1px; margin-bottom: 6px;
    background: linear-gradient(180deg, #ffe9d8, #ff8c5c 55%, #e74c3c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel .tag { font-size: 13.5px; opacity: .8; margin-bottom: 18px; line-height: 1.6; }
  .panel .result { font-size: 15px; margin-bottom: 16px; line-height: 1.8; }
  .panel .result b { color: #ff8c5c; font-size: 30px; }
  .newbest { color: #3ddc84; font-weight: 800; }
  .wallet-line { margin-top: 6px; color: #ffd166; font-size: 14px; font-weight: 700; }
  .big-btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    font-size: 18px; font-weight: 800; letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(180deg, #ffb08a, #ff8c5c 55%, #d6552c);
    box-shadow: 0 5px 0 #8a2f12;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a2f12; }
  .links { margin-top: 14px; font-size: 13px; }
  .links a { color: rgba(255,255,255,.65); text-decoration: underline; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
  <div class="score" id="scoreEl">0</div>
  <div class="right">
    <div id="levelEl">LEVEL 1</div>
    <div id="livesEl">❤️❤️❤️</div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>🧱 BRICK BLAST</h1>
    <div class="tag">Slide your finger to move the paddle.<br>Smash every brick — tough ones take<br>more hits. Don't drop the ball!</div>
    <button class="big-btn" id="startBtn">BLAST OFF</button>
    <div class="links">
      <a href="index.html">🏠 All games</a>
    </div>
  </div>
</div>

<div class="overlay hidden" id="gameover">
  <div class="panel">
    <h1 id="overTitle">💔 GAME OVER</h1>
    <div class="result">
      Score <b id="finalScore">0</b><br>
      <span id="levelReached"></span>
      <div class="newbest hidden" id="newBest">★ NEW BEST! ★</div>
      <div class="wallet-line" id="walletLine"></div>
    </div>
    <button class="big-btn" id="retryBtn">PLAY AGAIN</button>
    <div class="links">
      <a href="index.html">🏠 All games</a>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ---- shared arcade wallet ---- */
  const WALLET_KEY = "luckySpinSave_v1";
  function walletAdd(n) {
    let s = { balance: 1000, betIndex: 1, spins: 0, biggestWin: 0 };
    try { const j = JSON.parse(localStorage.getItem(WALLET_KEY)); if (j && typeof j.balance === "number") s = Object.assign(s, j); } catch (e) {}
    s.balance += n;
    localStorage.setItem(WALLET_KEY, JSON.stringify(s));
    return s.balance;
  }

  /* ---- audio ---- */
  let actx = null;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === "suspended") actx.resume();
  }
  function tone(f1, f2, dur, type, vol, when = 0) {
    if (!actx) return;
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    paddle: () => tone(380, 420, 0.05, "square", 0.045),
    wall: () => tone(260, 240, 0.04, "square", 0.03),
    brick: (hp) => tone(600 + hp * 140, 900 + hp * 140, 0.08, "triangle", 0.06),
    boom: () => tone(900, 200, 0.15, "sawtooth", 0.05),
    life: () => { tone(300, 80, 0.4, "sawtooth", 0.07); },
    levelup: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, "triangle", 0.06, i * 0.09)),
    lose: () => [400, 330, 262, 196].forEach((f, i) => tone(f, f * 0.95, 0.2, "sine", 0.06, i * 0.14)),
  };
  const buzz = (p) => { if (navigator.vibrate) navigator.vibrate(p); };

  /* ---- background music ---- */
  const MUSIC_BASS = [110, 0, 110, 110, 0, 131, 0, 0, 110, 0, 110, 110, 0, 165, 0, 147];
  const MUSIC_LEAD = [440, 0, 0, 523, 0, 587, 0, 0, 659, 0, 587, 0, 523, 0, 0, 0];
  const MUSIC_SPB = 0.15;
  let mStep = 0, mNext = 0, mTimer = null;
  function mNote(f, dur, type, vol, when) {
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function startMusic() {
    ensureAudio();
    if (mTimer || !actx) return;
    mStep = 0; mNext = actx.currentTime + 0.1;
    mTimer = setInterval(() => {
      if (!actx) return;
      while (mNext < actx.currentTime + 0.35) {
        const w = Math.max(0, mNext - actx.currentTime);
        const b = MUSIC_BASS[mStep % MUSIC_BASS.length];
        const l = MUSIC_LEAD[mStep % MUSIC_LEAD.length];
        if (b) mNote(b, 0.18, "triangle", 0.035, w);
        if (l) mNote(l, 0.11, "square", 0.012, w);
        mStep++; mNext += MUSIC_SPB;
      }
    }, 100);
  }

  /* ---- state ---- */
  const SAVE_KEY = "brickBlastBest_v1";
  let best = parseInt(localStorage.getItem(SAVE_KEY) || "0", 10) || 0;

  const BALL_R = 7;
  let mode = "menu";          // menu | serve | play | over
  let paddle = { x: 0, w: 110, y: 0 };
  let ball = { x: 0, y: 0, vx: 0, vy: 0 };
  let bricks = [];            // {x,y,w,h,hp,maxHp,hue,dead}
  let level = 1, score = 0, lives = 3;
  let particles = [];
  let shake = 0, overTimer = 0;

  const hud = document.getElementById("hud");
  const scoreEl = document.getElementById("scoreEl"), levelEl = document.getElementById("levelEl"), livesEl = document.getElementById("livesEl");

  function ballSpeed() { return Math.min(330 + level * 28 + score * 0.1, 620); }

  function buildLevel(n) {
    bricks = [];
    const cols = 7;
    const rows = Math.min(4 + n, 8);
    const margin = 10, gap = 6;
    const top = Math.max(80, H * 0.12);
    const bw = (W - margin * 2 - gap * (cols - 1)) / cols;
    const bh = 24;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        // pattern holes for variety
        if (n >= 2 && (r + c + n) % 7 === 0) continue;
        const hp = 1 + ((rows - 1 - r) + n) % 3;
        bricks.push({
          x: margin + c * (bw + gap),
          y: top + r * (bh + gap),
          w: bw, h: bh,
          hp, maxHp: hp,
          hue: (265 + r * 22 + n * 30) % 360,
        });
      }
    }
  }

  function serve() {
    paddle.w = Math.max(80, 120 - level * 4);
    paddle.y = H - 90;
    paddle.x = W / 2;
    ball = { x: W / 2, y: paddle.y - BALL_R - 2, vx: 0, vy: 0 };
    mode = "serve";
  }

  function launchBall() {
    if (mode !== "serve") return;
    const a = (-60 + Math.random() * 30 - 15) * Math.PI / 180;
    const s = ballSpeed();
    ball.vx = Math.cos(a) * s * (Math.random() < 0.5 ? 1 : -1) * 0.6;
    ball.vy = -Math.abs(Math.sin(a)) * s;
    normalizeBall();
    mode = "play";
  }
  function normalizeBall() {
    const s = ballSpeed();
    const m = Math.hypot(ball.vx, ball.vy) || 1;
    ball.vx = ball.vx / m * s;
    ball.vy = ball.vy / m * s;
    // never too flat
    if (Math.abs(ball.vy) < s * 0.25) {
      ball.vy = Math.sign(ball.vy || -1) * s * 0.25;
      const m2 = Math.hypot(ball.vx, ball.vy);
      ball.vx = ball.vx / m2 * s; ball.vy = ball.vy / m2 * s;
    }
  }

  function startGame() {
    ensureAudio();
    startMusic();
    level = 1; score = 0; lives = 3;
    particles = []; shake = 0;
    buildLevel(level);
    serve();
    document.getElementById("menu").classList.add("hidden");
    document.getElementById("gameover").classList.add("hidden");
    hud.classList.remove("hidden");
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = "LEVEL " + level;
    livesEl.textContent = "❤️".repeat(Math.max(0, lives));
  }

  function burst(x, y, hue, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 140;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.55, hue });
    }
  }

  function loseLife() {
    lives--;
    updateHud();
    sfx.life(); buzz([60, 40, 120]);
    shake = 10;
    if (lives <= 0) {
      mode = "over";
      overTimer = 0.8;
    } else {
      serve();
    }
  }

  function update(dt) {
    if (mode === "serve") {
      ball.x = paddle.x;
      ball.y = paddle.y - BALL_R - 2;
      return;
    }
    if (mode !== "play") return;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // walls
    if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); sfx.wall(); }
    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); sfx.wall(); }
    const topY = Math.max(54, H * 0.07);
    if (ball.y < topY + BALL_R) { ball.y = topY + BALL_R; ball.vy = Math.abs(ball.vy); sfx.wall(); }

    // paddle
    if (ball.vy > 0 &&
        ball.y + BALL_R >= paddle.y && ball.y + BALL_R <= paddle.y + 18 &&
        ball.x >= paddle.x - paddle.w / 2 - BALL_R && ball.x <= paddle.x + paddle.w / 2 + BALL_R) {
      const off = (ball.x - paddle.x) / (paddle.w / 2);   // -1 .. 1
      const angle = off * 60 * Math.PI / 180;
      const s = ballSpeed();
      ball.vx = Math.sin(angle) * s;
      ball.vy = -Math.cos(angle) * s;
      ball.y = paddle.y - BALL_R;
      sfx.paddle(); buzz(8);
    }

    // bricks
    for (const b of bricks) {
      if (b.dead) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy <= BALL_R * BALL_R) {
        // bounce by side of least penetration
        const penX = BALL_R - Math.abs(dx), penY = BALL_R - Math.abs(dy);
        if (Math.abs(dx) > Math.abs(dy)) ball.vx = Math.sign(dx || 1) * Math.abs(ball.vx);
        else ball.vy = Math.sign(dy || 1) * Math.abs(ball.vy);
        b.hp--;
        if (b.hp <= 0) {
          b.dead = true;
          score += 10 * b.maxHp;
          sfx.boom(); buzz(12);
          burst(b.x + b.w / 2, b.y + b.h / 2, b.hue, 10);
        } else {
          score += 2;
          sfx.brick(b.hp);
        }
        updateHud();
        break;
      }
    }

    // level cleared
    if (bricks.every((b) => b.dead)) {
      level++;
      score += 100;
      sfx.levelup(); buzz([40, 30, 40, 30, 90]);
      buildLevel(level);
      serve();
      updateHud();
      return;
    }

    // dropped
    if (ball.y > H + 30) loseLife();
  }

  /* ---- input ---- */
  function movePaddle(clientX) {
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, clientX));
  }
  window.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest(".panel")) return;
    ensureAudio();
    movePaddle(e.clientX);
    if (mode === "serve") launchBall();
  });
  window.addEventListener("pointermove", (e) => {
    if (mode === "play" || mode === "serve") movePaddle(e.clientX);
  });
  window.addEventListener("keydown", (e) => {
    ensureAudio();
    if (e.key === "ArrowLeft") movePaddle(paddle.x - 40);
    else if (e.key === "ArrowRight") movePaddle(paddle.x + 40);
    else if (e.key === " " && mode === "serve") launchBall();
  });

  /* ---- drawing ---- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1e1040");
    g.addColorStop(1, "#0e0720");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // bricks
    for (const b of bricks) {
      if (b.dead) continue;
      const lit = 38 + b.hp * 10;
      ctx.fillStyle = `hsl(${b.hue}, 75%, ${lit}%)`;
      ctx.shadowColor = `hsl(${b.hue}, 85%, 60%)`;
      ctx.shadowBlur = 8;
      rr(b.x, b.y, b.w, b.h, 6);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,.18)";
      rr(b.x, b.y, b.w, b.h / 2.4, 6);
      ctx.fill();
      if (b.maxHp > 1) {
        ctx.fillStyle = "rgba(0,0,0,.4)";
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 4);
      }
    }

    // paddle
    const pg = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + 16);
    pg.addColorStop(0, "#ffb08a");
    pg.addColorStop(1, "#d6552c");
    ctx.fillStyle = pg;
    ctx.shadowColor = "#ff8c5c";
    ctx.shadowBlur = 14;
    rr(paddle.x - paddle.w / 2, paddle.y, paddle.w, 16, 8);
    ctx.fill();
    ctx.shadowBlur = 0;

    // ball
    if (mode === "play" || mode === "serve") {
      ctx.shadowColor = "#fff";
      ctx.shadowBlur = 16;
      const bg2 = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, BALL_R);
      bg2.addColorStop(0, "#fff");
      bg2.addColorStop(1, "#ffd166");
      ctx.fillStyle = bg2;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
    }
    if (mode === "serve") {
      ctx.fillStyle = "rgba(255,255,255,.7)";
      ctx.font = "600 15px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("tap to launch", W / 2, paddle.y + 52);
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.55);
      ctx.fillStyle = `hsl(${p.hue}, 80%, 60%)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* ---- loop ---- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.03);
    last = now;
    update(dt);
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 500 * dt;
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
    if (mode === "over" && overTimer > 0) {
      overTimer -= dt;
      if (overTimer <= 0) showGameOver();
    }
    shake = Math.max(0, shake - dt * 30);
    draw();
    requestAnimationFrame(frame);
  }

  function showGameOver() {
    sfx.lose();
    if (score > best) {
      best = score;
      localStorage.setItem(SAVE_KEY, String(best));
      document.getElementById("newBest").classList.remove("hidden");
    } else document.getElementById("newBest").classList.add("hidden");
    const earned = Math.floor(score / 5) + level * 20;
    const bal = walletAdd(earned);
    document.getElementById("walletLine").textContent = "+🪙 " + earned + " earned · Wallet " + bal.toLocaleString("en-US");
    document.getElementById("finalScore").textContent = score;
    document.getElementById("levelReached").textContent = "Reached level " + level;
    document.getElementById("gameover").classList.remove("hidden");
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);

  requestAnimationFrame(frame);

  // debug/testing hook
  window.__breaker = {
    get mode() { return mode; },
    get ball() { return ball; },
    get paddle() { return paddle; },
    get bricks() { return bricks; },
    get lives() { return lives; },
    get level() { return level; },
    get score() { return score; },
    startGame, launchBall,
    setBall(x, y, vx, vy) { ball = { x, y, vx, vy }; },
    setPaddle(x) { paddle.x = x; },
  };
})();
</script>
</body>
</html>
