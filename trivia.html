  }
  function tone(f1, f2, dur, type, vol, when = 0) {
    if (!actx) return;

    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }

  const WRITE_SEC = 40;   // time to write a bluff

  // forgiving Arabic-aware normalizer for matching bluffs to the truth / each other
  function normAns(s) {
    return String(s).trim().toLowerCase()
      .replace(/[ً-ْٰـ]/g, "")           // tashkeel + tatweel
      .replace(/[أإآ]/g, "ا")
      .replace(/ى/g, "ي")
      .replace(/ة/g, "ه")
      .replace(/[.،,؛؟?!"'()]/g, "")
      .replace(/^(ال|الـ)/, "")          // drop leading definite article
      .replace(/\s+/g, " ");

  // convert Arabic-Indic (٠-٩) and Persian (۰-۹) digits to ASCII
  function toAsciiDigits(s) {
    return String(s)
      .replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660))
      .replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 0x06F0));
  }
  // spelled-out Arabic numbers used as answers -> digit (keys are normalized, no leading ال strip)
  const NUMWORDS = {
    "صفر":"0","واحد":"1","واحده":"1","احد":"1","اثنان":"2","اثنتان":"2","اثنين":"2","ثنتان":"2",
    "ثلاثه":"3","ثلاث":"3","اربعه":"4","اربع":"4","خمسه":"5","خمس":"5","سته":"6","ست":"6",
    "سبعه":"7","سبع":"7","ثمانيه":"8","ثماني":"8","ثمان":"8","تسعه":"9","تسع":"9","عشره":"10","عشر":"10",
    "احد عشر":"11","اثنا عشر":"12","اثنتا عشره":"12","عشرون":"20","عشرين":"20","ثلاثون":"30","ثلاثين":"30",
    "اربعون":"40","خمسون":"50","سبعون":"70","مئه":"100","مايه":"100","الف":"1000","مليون":"1000000","مليار":"1000000000",
  };
  function numWordNorm(s) {
    return toAsciiDigits(String(s)).trim().toLowerCase()
      .replace(/[ً-ْٰـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, " ");
  }
  // returns the digit string if `s` is numeric (digits or a known Arabic number word), else null
  function numericValue(s) {
    const t = toAsciiDigits(String(s)).trim();
    if (/^\d+(\.\d+)?$/.test(t)) return t;
    const w = numWordNorm(s);
    return NUMWORDS[w] !== undefined ? NUMWORDS[w] : null;
  }

  function createTriviaEngine(send) {
    const E = {
      players: [],        // {id,name,score,gone, bluff, bluffNorm, vote}
      phase: "lobby",     // lobby | write | choose | reveal | gameEnd
      cats: [],
      diff: null,
      qIndex: 0,
      TOTAL: 0,
      deck: [],           // [{q, answer, catName}]
      cur: null,
      options: [],        // [{id, text, truth, authors:[ids], pickers:[ids]}]

    };

    const bcast = (msg) => { for (const p of alive()) send(p.id, msg); };
    const ri = (n) => Math.floor(Math.random() * n);
    const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = ri(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
    const nameOf = (id) => { const p = E.players.find((x) => x.id === id); return p ? p.name : "?"; };
    const addDelta = (p, n) => { E.deltas[p.name] = (E.deltas[p.name] || 0) + n; };

    E.addPlayer = (id, name) => {
      if (E.phase !== "lobby" || E.players.length >= 8) return false;
      let n = (name || "لاعب").trim().slice(0, 14) || "لاعب";

      sendLobby();
      return n;

      if (E.phase === "lobby") { E.players = E.players.filter((x) => x.id !== id); sendLobby(); return; }

      const diff = DIFFS.find((d) => d.id === diffId) || DIFFS[0];
      let ids = (Array.isArray(catIds) ? catIds : [catIds]).filter((id) => BANK[id]);

      E.cats = ids; E.diff = diff;
      for (const p of E.players) p.score = 0;

      let pool = [];
      for (const id of ids) {
        const cname = (CATS.find((c) => c.id === id) || {}).name || "";
        for (const item of (BANK[id][diff.id] || [])) pool.push({ q: item.q, a: item.a, c: item.c, catName: cname });
      }
      E.deck = shuffle(pool).slice(0, Math.min(ROUNDS, pool.length)).map((item) => {
        const truth = item.a[item.c];
        const distract = item.a.filter((_, i) => i !== item.c);
        const v = numericValue(truth);
        if (v !== null) {   // numeric question: digits everywhere + (رقم) marker
          return {
            q: item.q + " (رقم)", answer: v, num: true, catName: item.catName,
            fakes: distract.map((x) => { const nv = numericValue(x); return nv !== null ? nv : x; }),

        return { q: item.q, answer: truth, num: false, catName: item.catName, fakes: distract };
      });

    };

    function resetRound() {
      for (const p of E.players) { p.bluff = null; p.bluffNorm = null; p.vote = null; }
      E.options = [];
      E.deltas = {};
    }

    function nextRound() {
      E.phase = "write";
      E.cur = E.deck[E.qIndex];
      resetRound();
      bcast({ t: "write", index: E.qIndex + 1, total: E.TOTAL, q: E.cur.q, num: !!E.cur.num, cat: E.cur.catName, diff: E.diff.name, seconds: WRITE_SEC });
    }

    // ---- phase 1: write a bluff ----
    E.submitBluff = (id, text) => {
      if (E.phase !== "write") return;
      const p = E.players.find((x) => x.id === id);
      if (!p || p.gone || p.bluff !== null) return;
      const t = toAsciiDigits(String(text || "")).trim().slice(0, 40);   // Arabic digits -> ASCII
      if (!t) return;
      if (E.cur.num && !/^\d+(\.\d+)?$/.test(t)) { send(p.id, { t: "rebluff", reason: "num" }); return; }
      if (normAns(t) === normAns(E.cur.answer)) { send(p.id, { t: "rebluff", reason: "truth" }); return; }
      p.bluff = t;
      p.bluffNorm = normAns(t);
      send(p.id, { t: "wrote" });
      maybeAllWrote();
    };
    function maybeAllWrote() {
      if (E.phase !== "write") return;
      if (alive().length && alive().every((p) => p.bluff !== null)) toChoose();
    }
    E.forceWrite = () => { if (E.phase === "write") toChoose(); };

    // ---- build the option list (truth + unique fakes) and move to choose ----
    function toChoose() {
      if (E.phase !== "write") return;
      E.phase = "choose";
      const realNorm = normAns(E.cur.answer);
      const map = new Map();
      map.set(realNorm, { text: E.cur.answer, truth: true, authors: [] });
      for (const p of alive()) {
        if (p.bluff === null || p.bluffNorm === realNorm) continue;
        const e = map.get(p.bluffNorm);
        if (e && !e.truth) e.authors.push(p.id);   // same bluff from several players -> one option
        else if (!e) map.set(p.bluffNorm, { text: p.bluff, truth: false, authors: [p.id] });
      }
      // with 5 players or fewer, top up to 5 options with game-written decoys (none if more than 5)
      if (alive().length <= 5) {
        for (const f of (E.cur.fakes || [])) {
          if (map.size >= 5) break;
          const fn = normAns(f);
          if (!map.has(fn)) map.set(fn, { text: f, truth: false, authors: [] });
        }
      }
      E.options = shuffle([...map.values()]);
      E.options.forEach((o, i) => { o.id = i; o.pickers = []; });
      for (const p of alive()) {
        let mineId = null;
        for (const o of E.options) if (o.authors.indexOf(p.id) !== -1) { mineId = o.id; break; }
        send(p.id, {
          t: "choices", index: E.qIndex + 1, total: E.TOTAL, q: E.cur.q,
          cat: E.cur.catName, diff: E.diff.name, seconds: CHOOSE_SEC,
          options: E.options.map((o) => ({ id: o.id, text: o.text })), mineId,
        });
      }
    }

    // ---- phase 2: pick the real answer ----
    E.vote = (id, optId) => {
      if (E.phase !== "choose") return;
      const p = E.players.find((x) => x.id === id);
      if (!p || p.gone || p.vote !== null) return;
      const opt = E.options.find((o) => o.id === optId);
      if (!opt || opt.authors.indexOf(id) !== -1) return;   // no picking your own bluff
      p.vote = optId;
      send(p.id, { t: "voted", optId });
      maybeAllVoted();
    };
    function maybeAllVoted() {
      if (E.phase !== "choose") return;
      if (alive().length && alive().every((p) => p.vote !== null)) E.endRound();
    }
    E.forceVote = () => { if (E.phase === "choose") E.endRound(); };

    E.endRound = () => {
      if (E.phase !== "choose") return;
      E.phase = "reveal";
      for (const o of E.options) o.pickers = [];
      for (const p of alive()) if (p.vote !== null) {
        const o = E.options.find((x) => x.id === p.vote);
        if (o) o.pickers.push(p.id);
      }
      // score: finding the truth, knowing it, and fooling others
      for (const p of alive()) {
        const voted = p.vote !== null ? E.options.find((o) => o.id === p.vote) : null;
        if (voted && voted.truth) { p.score += PT_TRUTH; addDelta(p, PT_TRUTH); }
      }
      for (const o of E.options) {
        if (o.truth || !o.pickers.length) continue;
        for (const aid of o.authors) {
          const a = E.players.find((x) => x.id === aid);
          if (a) { a.score += PT_FOOL * o.pickers.length; addDelta(a, PT_FOOL * o.pickers.length); }
        }
      }
      const final = E.qIndex >= E.TOTAL - 1;
      const board = [...alive()].sort((a, b) => b.score - a.score)
        .map((p) => ({ name: p.name, total: p.score, delta: E.deltas[p.name] || 0 }));
      const optionsOut = E.options.map((o) => ({
        text: o.text, truth: o.truth,
        authors: o.authors.map(nameOf), pickers: o.pickers.map(nameOf),
      }));
      bcast({
        t: "reveal", q: E.cur.q, answer: E.cur.answer, cat: E.cur.catName, diff: E.diff.name,
        options: optionsOut, board, index: E.qIndex + 1, total: E.TOTAL, final,
      });
    };

    E.next = () => {
      if (E.phase !== "reveal" || E.qIndex >= E.TOTAL - 1) return;
      E.qIndex++;
      nextRound();
    };
    E.playAgain = () => {
      if (E.phase !== "reveal" || E.qIndex < E.TOTAL - 1) return;
      E.phase = "lobby";
      E.players = E.players.filter((p) => !p.gone);
      for (const p of E.players) p.score = 0;
      sendLobby();
    };

      engine.sendLobby();
    });
    peer.on("error", (e) => showHome("تعذّر إنشاء الغرفة (" + e.type + "). حاول مجددًا."));
  }

  function joinGame(code, name) {
    myName = name;
    isHost = false;
    showWait("جارٍ الانضمام إلى الغرفة " + code.toUpperCase() + "…");
    peer = new Peer();
    peer.on("open", () => {
      clientConn = peer.connect(peerId(code), { reliable: true });
      let opened = false;
      clientConn.on("open", () => { opened = true; clientConn.send({ t: "join", name }); });
      clientConn.on("data", (msg) => handleMsg(msg));
      clientConn.on("close", () => showHome("انقطع الاتصال. أعد الانضمام بالرمز."));
      setTimeout(() => { if (!opened) showHome("الغرفة غير موجودة — تحقق من الرمز (على المضيف إبقاء شاشته مفتوحة)."); }, 9000);
    });
    peer.on("error", (e) => {
      if (e.type === "peer-unavailable") showHome("الغرفة غير موجودة — تحقق من الرمز (على المضيف إبقاء شاشته مفتوحة).");
      else showHome("خطأ في الاتصال (" + e.type + ").");
    });
  }

  const toHost = (msg) => {
    if (isHost) {
      if (msg.t === "bluff") engine.submitBluff("host", msg.text);
      else if (msg.t === "vote") engine.vote("host", msg.optId);
    } else if (clientConn) clientConn.send(msg);
  };

  /* ---- timers ---- */
  let phaseDur = 1;
  function startCountdown(seconds) {
    secondsLeft = seconds; phaseDur = seconds || 1;
    countdown = setInterval(() => {
      secondsLeft--;
      const bar = document.getElementById("tbar");
      if (bar) bar.style.width = Math.max(0, (secondsLeft / phaseDur) * 100) + "%";
      const tl = document.getElementById("tleft");
      if (tl) tl.textContent = secondsLeft + "ث";
      if (secondsLeft <= 5 && secondsLeft > 0) sTick();
      if (secondsLeft <= 0) clearInterval(countdown);
    }, 1000);
  }
  function hostPhaseClock(seconds, fn) {
    if (!isHost) return;
    let left = seconds;
    hostTurnIv = setInterval(() => { left--; if (left <= 0) { stopHostClock(); fn(); } }, 1000);
  }

  /* ---- message handling ---- */
  function handleMsg(msg) {
    if (msg.t === "lobby") { clearTimers(); stopHostClock(); renderLobby(msg); }
    else if (msg.t === "write") {
      clearTimers(); stopHostClock(); sWhoosh(); buzz(20);
      cur = { phase: "write", index: msg.index, total: msg.total, q: msg.q, num: !!msg.num, cat: msg.cat, diff: msg.diff, wrote: false, pending: false };
      renderWrite(); startCountdown(msg.seconds);
      if (isHost) hostPhaseClock(msg.seconds, () => engine.forceWrite());
    }
    else if (msg.t === "wrote") { if (cur) { cur.wrote = true; cur.pending = false; } sLock(); buzz(15); markWrote(); }
    else if (msg.t === "rebluff") { if (cur) cur.pending = false; sWrong(); buzz(40); reopenBluff(msg.reason); }
    else if (msg.t === "choices") {
      clearTimers(); stopHostClock(); sWhoosh(); buzz(15);
      cur = { phase: "choose", index: msg.index, total: msg.total, q: msg.q, cat: msg.cat, diff: msg.diff,
              options: msg.options, mineId: msg.mineId, voted: false, myVote: null };
      renderChoose(); startCountdown(msg.seconds);
      if (isHost) hostPhaseClock(msg.seconds, () => engine.forceVote());
    }
    else if (msg.t === "voted") { if (cur) { cur.voted = true; cur.myVote = msg.optId; } sLock(); buzz(15); markVoted(); }
    else if (msg.t === "reveal") {
      clearTimers(); stopHostClock();
      after(0, () => (msg.final ? sChamp : sReveal)());
      buzz(msg.final ? [60, 40, 60, 40, 140] : 30);
      renderReveal(msg);
    }
  }

  function hostBtn(label, fn, extra) {
    const id = "hb" + Math.random().toString(36).slice(2, 8);
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.onclick = () => { ensureAudio(); sClick(); fn(); };
    }, 0);
    return `<button class="btn ${extra || ""}" id="${id}">${label}</button>`;
  }

  function showHome(err) {
    clearTimers(); stopHostClock();
    h(`
      <div class="box">
        <h2>اسمك</h2>
        <input id="nameIn" maxlength="14" placeholder="مثال: كيرا" autocomplete="off">
        <div class="err">${err ? esc(err) : ""}</div>
        ${hostBtn("أنشئ غرفة", () => {
          const n = document.getElementById("nameIn").value.trim();
          if (!n) return showHome("اكتب اسمك أولاً!");
          if (typeof Peer === "undefined") return showHome("تعذّر تحميل مكتبة الشبكة — تحقق من الإنترنت.");
          hostGame(n);
        })}
      </div>
      <div class="box">
        <h2>أو انضم لغرفة</h2>
        <input id="codeIn" maxlength="4" placeholder="الرمز" style="letter-spacing:8px;text-transform:uppercase;direction:ltr" autocomplete="off">
        ${hostBtn("انضمام", () => {
          const n = document.getElementById("nameIn").value.trim();
          const c = document.getElementById("codeIn").value.trim();
          if (!n) return showHome("اكتب اسمك أولاً!");
          if (c.length !== 4) return showHome("الرمز مكوّن من ٤ أحرف.");
          if (typeof Peer === "undefined") return showHome("تعذّر تحميل مكتبة الشبكة — تحقق من الإنترنت.");
          joinGame(c, n);
        }, "alt")}
      </div>
    `);
  }
  function showWait(text) { h(`<div class="box waiting pulse">${esc(text)}</div>`); }

  function renderLobby(msg) {
    lastLobby = msg;
    let hostSetup = "";
    if (isHost) {
      const catCards = CATS.map((c) => {
        const id = "cat_" + c.id;
        setTimeout(() => { const el = document.getElementById(id); if (el) el.onclick = () => { ensureAudio(); sClick(); if (selCats.has(c.id)) selCats.delete(c.id); else selCats.add(c.id); renderLobby(lastLobby); }; }, 0);
        return `<button class="catbtn ${selCats.has(c.id) ? "sel" : ""}" id="${id}"><span class="ce">${c.emoji}</span>${c.name}</button>`;
      }).join("");
      const allOn = selCats.size === CATS.length;
      setTimeout(() => { const el = document.getElementById("catAll"); if (el) el.onclick = () => { ensureAudio(); sClick(); if (allOn) selCats.clear(); else selCats = new Set(CATS.map((c) => c.id)); renderLobby(lastLobby); }; }, 0);
      const diffBtns = DIFFS.map((d) => {
        const id = "diff_" + d.id;
        setTimeout(() => { const el = document.getElementById(id); if (el) el.onclick = () => { ensureAudio(); sClick(); selDiff = d.id; renderLobby(lastLobby); }; }, 0);
        return `<button class="diffbtn ${selDiff === d.id ? "sel" : ""}" id="${id}">${d.name}</button>`;
      }).join("");
      const startCtl = (msg.canStart && selCats.size)
        ? hostBtn(`ابدأ التحدّي 🧠 (${selCats.size} فئة)`, () => engine.start(Array.from(selCats), selDiff))
        : `<button class="btn" disabled>${msg.canStart ? "اختر فئة واحدة على الأقل ☝️" : "نحتاج متسابقَين على الأقل…"}</button>`;
      hostSetup = `
        <div class="box">
          <h2>اختر فئات الأسئلة (يمكن اختيار أكثر من فئة)</h2>
          <div class="cat-grid">${catCards}</div>
          <button class="diffbtn" id="catAll" style="width:100%;margin-top:10px">${allOn ? "إلغاء تحديد الكل" : "تحديد كل الفئات"}</button>
          <h2 style="margin-top:14px">مستوى الصعوبة</h2>
          <div class="diff-row">${diffBtns}</div>
        </div>
        ${startCtl}`;
    }
    h(`
      ${isHost ? `<div class="box" style="text-align:center">
        <h2>رمز الغرفة — أخبر أصدقاءك</h2>
        <div class="code-big">${engine.code}</div>
        <div class="code-hint">يفتحون هذه الصفحة ← انضمام ← يكتبون الرمز<br>أبقِ هذه الشاشة مفتوحة أثناء انضمامهم</div>
      </div>` : ""}
      <div class="box">
        <h2>المتسابقون (${msg.players.length}/8)</h2>
        <div class="chips">${msg.players.map((p) => `<span class="chip ${p === myName ? "me" : ""}">${esc(p)}</span>`).join("")}</div>
      </div>
      ${isHost ? hostSetup : `<div class="waiting pulse">بانتظار أن يبدأ المضيف…</div>`}
    `);
  }

  const roundHead = () => `
    <div class="turn-head"><span>الجولة ${cur.index}/${cur.total}</span><span id="tleft">…</span></div>
    ${cur.cat ? `<div class="catline">${esc(cur.cat)} · ${esc(cur.diff)}</div>` : ""}
    <div class="timebar-wrap"><div class="timebar" id="tbar" style="width:100%"></div></div>`;

  /* ---- phase 1: write a bluff ---- */
  function bluffGo() {
    if (cur.wrote || cur.pending) return;
    const inp = document.getElementById("bluffIn");
    let v = (inp && inp.value || "").trim();
    if (!v) { if (inp) inp.focus(); return; }
    if (cur.num) { v = toAsciiDigits(v); if (!/^\d+(\.\d+)?$/.test(v)) { reopenBluff("num"); return; } if (inp) inp.value = v; }
    ensureAudio(); cur.pending = true;
    const b = document.getElementById("bluffBtn");
    if (inp) inp.disabled = true;
    if (b) { b.disabled = true; b.textContent = "جارٍ الإرسال…"; }
    const note = document.getElementById("lockNote"); if (note) { note.textContent = ""; note.className = "waiting"; }
    toHost({ t: "bluff", text: v });
  }
  function renderWrite() {
    setTimeout(() => {
      const inp = document.getElementById("bluffIn"), b = document.getElementById("bluffBtn");
      if (b) b.onclick = bluffGo;
      if (inp) { inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); bluffGo(); } }; inp.focus(); }
    }, 0);
    const numHint = cur.num ? `<div class="bluff-hint">🔢 هذا سؤال رقمي — اكتب <b>رقماً</b> فقط (يُحوّل ٥ إلى 5 تلقائياً).</div>` : "";
    h(roundHead() + `
      <div class="qtext">${esc(cur.q)}</div>
      <div class="bluff-hint">💡 اكتب إجابة <b>مزيّفة</b> تبدو صحيحة لتخدع البقية. كل من يقع في فخّك يمنحك نقاطاً!</div>
      ${numHint}
      <input id="bluffIn" maxlength="40" placeholder="${cur.num ? "اكتب رقماً…" : "اكتب فخّك هنا…"}" autocomplete="off"${cur.num ? ' inputmode="numeric"' : ""}>
      <button class="btn" id="bluffBtn">أرسل الفخّ 🎭</button>
      <div class="waiting" id="lockNote"></div>
      ${isHost ? hostBtn("⏭ إنهاء الكتابة", () => engine.forceWrite(), "ghost") : ""}`);
  }
  function markWrote() {
    const inp = document.getElementById("bluffIn"), b = document.getElementById("bluffBtn");
    if (inp) inp.disabled = true;
    if (b) { b.disabled = true; b.textContent = "تم الإرسال ✔️"; }
    const note = document.getElementById("lockNote");
    if (note) { note.className = "waiting"; note.textContent = "أرسلت فخّك — بانتظار البقية…"; }
  }
  function reopenBluff(reason) {
    const inp = document.getElementById("bluffIn"), b = document.getElementById("bluffBtn");
    if (inp) { inp.disabled = false; inp.focus(); }
    if (b) { b.disabled = false; b.textContent = "أرسل الفخّ 🎭"; }
    const note = document.getElementById("lockNote");
    if (note) {
      note.className = "err";
      note.textContent = reason === "truth"
        ? "✋ هذه هي الإجابة الصحيحة! اكتب فخّاً مختلفاً."
        : "✋ اكتب رقماً فقط.";
    }
  }

  /* ---- phase 2: pick the real answer ---- */
  function renderChoose() {
    const list = cur.options.map((o) => {
      const own = o.id === cur.mineId;
      const id = "opt" + o.id;
      if (!own) setTimeout(() => {
        const el = document.getElementById(id);
        if (el) el.onclick = () => {
          if (cur.voted) return;
          ensureAudio(); cur.voted = true; cur.myVote = o.id; markVoted(); toHost({ t: "vote", optId: o.id });
        };
      }, 0);
      return `<button class="opt ${own ? "own" : ""}" id="${id}" ${own ? "disabled" : ""}>${esc(o.text)}${own ? ` <span class="meta">✍️ هذا فخّك</span>` : ""}</button>`;
    }).join("");
    h(roundHead() + `
      <div class="qtext">${esc(cur.q)}</div>
      <div class="bluff-hint">🔍 اختر <b>الإجابة الحقيقية</b> من بين الأفخاخ</div>
      <div class="opt-list">${list}</div>
      <div class="waiting" id="lockNote"></div>
      ${isHost ? hostBtn("⏭ إنهاء التصويت", () => engine.forceVote(), "ghost") : ""}`);
  }
  function markVoted() {
    cur.options.forEach((o) => {
      const el = document.getElementById("opt" + o.id);
      if (el) { el.disabled = true; if (o.id === cur.myVote) el.classList.add("picked"); }
    });
    const note = document.getElementById("lockNote");
    if (note) note.textContent = "تم اختيارك — بانتظار البقية…";
  }

  /* ---- reveal: who fooled whom ---- */
  function renderReveal(msg) {
    const me = msg.board.find((b) => b.name === myName) || { delta: 0 };
    const foundTruth = msg.options.some((o) => o.truth && o.pickers.indexOf(myName) !== -1);
    const fooled = msg.options.filter((o) => o.authors.indexOf(myName) !== -1)
      .reduce((s, o) => s + o.pickers.length, 0);
    const lines = [];
    if (foundTruth) lines.push("✅ وجدت الحقيقة!");
    else lines.push("❌ لم تجد الحقيقة هذه المرة");
    if (fooled > 0) lines.push(`🎭 خدعت ${fooled} ${fooled === 1 ? "لاعباً" : "لاعبين"}!`);
    const ok = foundTruth || fooled > 0;
    const banner = `<div class="result-banner ${ok ? "ok" : "no"}">${lines.join(" • ")}${me.delta ? ` (+${me.delta})` : ""}</div>`;

    const opts = [...msg.options].sort((a, b) => (b.truth ? 1 : 0) - (a.truth ? 1 : 0) || b.pickers.length - a.pickers.length);
    const optHtml = opts.map((o) => {
      const who = o.truth
        ? `<span class="meta">✔️ الإجابة الصحيحة</span>`
        : (o.authors.length
            ? `<span class="meta">✍️ فخّ: ${o.authors.map(esc).join("، ")}</span>`
            : `<span class="meta">🤖 فخّ من اللعبة</span>`);
      const picks = o.pickers.length
        ? `<span class="meta">🎯 اختاره: ${o.pickers.map(esc).join("، ")}</span>`
        : `<span class="meta">🎯 لم يختره أحد</span>`;
      return `<div class="opt ${o.truth ? "truth" : "fake"}">${esc(o.text)}${who}${picks}</div>`;
    }).join("");

    const max = Math.max(...msg.board.map((b) => b.total), 1);
    const medals = ["🥇", "🥈", "🥉"];
    const rows = msg.board.map((b, i) => `
      <div class="brow ${b.name === myName ? "me" : ""}">
        <div class="bar" style="width:${(b.total / max) * 100}%"></div>
        <div class="medal">${medals[i] || (i + 1)}</div>
        <div class="bname">${esc(b.name)}</div>
        <div class="bpts">${b.total}</div>
        <div class="bdelta">${b.delta ? "+" + b.delta : ""}</div>
      </div>`).join("");
    const champ = msg.final ? `<div class="champ">👑 ${esc(msg.board[0].name)} بطل المُخادعين!</div>` : "";
    const ctl = isHost
      ? (msg.final ? hostBtn("العب مجددًا 🔁", () => engine.playAgain()) : hostBtn("الجولة التالية ⏭", () => engine.next()))
      : `<div class="waiting pulse">${msg.final ? "يمكن للمضيف بدء جولة جديدة…" : "بانتظار المضيف…"}</div>`;

    h(`
      <div class="turn-head"><span>${msg.final ? "النتائج النهائية" : "الجولة " + msg.index + "/" + msg.total}</span><span>الكشف 🎭</span></div>
      ${msg.cat ? `<div class="catline">${esc(msg.cat)} · ${esc(msg.diff)}</div>` : ""}
      <div class="qtext" style="font-size:16px;min-height:0;padding:14px">${esc(msg.q)}</div>
      ${banner}
      <div class="opt-list">${optHtml}</div>
      ${champ}
      <div class="box board">${rows}</div>
      ${ctl}
    `);
  }

  showHome();
})();
</script>
</body>
</html>
