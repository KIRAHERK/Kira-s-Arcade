<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1420">
<title>Neon Snake 🐍</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #0a1420; }
  body { font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }

  .hud {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 5;
    color: #fff;
    text-shadow: 0 0 16px rgba(61, 220, 132, .8), 0 2px 8px rgba(0,0,0,.5);
  }
  .hud .score { font-size: 50px; font-weight: 900; line-height: 1; }
  .hud .best { font-size: 13px; font-weight: 700; opacity: .75; margin-top: 2px; }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(5, 12, 20, 0.65);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .panel {
    width: min(88vw, 340px);
    background: linear-gradient(180deg, #122b34, #0a1a22);
    border: 1px solid rgba(61, 220, 132, .55);
    border-radius: 22px;
    padding: 26px 22px;
    text-align: center;
    color: #fff;
    box-shadow: 0 16px 50px rgba(0,0,0,.55), 0 0 40px rgba(61,220,132,.12);
    animation: pop .35s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .panel h1 {
    font-size: 30px; letter-spacing: 1px; margin-bottom: 6px;
    background: linear-gradient(180deg, #d8ffe9, #3ddc84 55%, #19b48a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel .tag { font-size: 13.5px; opacity: .8; margin-bottom: 18px; line-height: 1.6; }
  .panel .result { font-size: 15px; margin-bottom: 16px; line-height: 1.8; }
  .panel .result b { color: #3ddc84; font-size: 30px; }
  .newbest { color: #ffd166; font-weight: 800; }
  .wallet-line { margin-top: 6px; color: #ffd166; font-size: 14px; font-weight: 700; }
  .big-btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    font-size: 18px; font-weight: 800; letter-spacing: 2px;
    color: #06250f;
    background: linear-gradient(180deg, #9be8c0, #3ddc84 55%, #1f9c5b);
    box-shadow: 0 5px 0 #11603a;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #11603a; }
  .links { margin-top: 14px; font-size: 13px; }
  .links a { color: rgba(255,255,255,.65); text-decoration: underline; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
  <div class="score" id="scoreEl">0</div>
  <div class="best" id="bestEl">BEST 0</div>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>🐍 NEON SNAKE</h1>
    <div class="tag">Swipe to steer. Eat the orbs, grow long,<br>and don't bite yourself (or the walls).</div>
    <button class="big-btn" id="startBtn">SLITHER</button>
    <div class="links">
      <a href="index.html">🏠 All games</a>
    </div>
  </div>
</div>

<div class="overlay hidden" id="gameover">
  <div class="panel">
    <h1>💥 TANGLED!</h1>
    <div class="result">
      Orbs <b id="finalScore">0</b>
      <div class="newbest hidden" id="newBest">★ NEW BEST! ★</div>
      <div class="wallet-line" id="walletLine"></div>
    </div>
    <button class="big-btn" id="retryBtn">SLITHER AGAIN</button>
    <div class="links">
      <a href="index.html">🏠 All games</a>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ---- shared arcade wallet ---- */
  const WALLET_KEY = "luckySpinSave_v1";
  function walletAdd(n) {
    let s = { balance: 1000, betIndex: 1, spins: 0, biggestWin: 0 };
    try { const j = JSON.parse(localStorage.getItem(WALLET_KEY)); if (j && typeof j.balance === "number") s = Object.assign(s, j); } catch (e) {}
    s.balance += n;
    localStorage.setItem(WALLET_KEY, JSON.stringify(s));
    return s.balance;
  }

  /* ---- audio ---- */
  let actx = null;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === "suspended") actx.resume();
  }
  function tone(f1, f2, dur, type, vol, when = 0) {
    if (!actx) return;
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    eat: (n) => tone(500 + (n % 10) * 50, 800 + (n % 10) * 50, 0.1, "triangle", 0.06),
    turn: () => tone(300, 320, 0.03, "square", 0.018),
    die: () => { tone(400, 60, 0.45, "sawtooth", 0.08); tone(180, 50, 0.5, "square", 0.05); },
  };
  const buzz = (p) => { if (navigator.vibrate) navigator.vibrate(p); };

  /* ---- background music ---- */
  const MUSIC_BASS = [98, 0, 98, 0, 131, 0, 110, 0, 98, 0, 98, 0, 147, 0, 131, 0];
  const MUSIC_LEAD = [392, 0, 440, 494, 0, 392, 0, 0, 587, 0, 523, 494, 0, 440, 0, 0];
  const MUSIC_SPB = 0.16;
  let mStep = 0, mNext = 0, mTimer = null;
  function mNote(f, dur, type, vol, when) {
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function startMusic() {
    ensureAudio();
    if (mTimer || !actx) return;
    mStep = 0; mNext = actx.currentTime + 0.1;
    mTimer = setInterval(() => {
      if (!actx) return;
      while (mNext < actx.currentTime + 0.35) {
        const w = Math.max(0, mNext - actx.currentTime);
        const b = MUSIC_BASS[mStep % MUSIC_BASS.length];
        const l = MUSIC_LEAD[mStep % MUSIC_LEAD.length];
        if (b) mNote(b, 0.2, "triangle", 0.035, w);
        if (l) mNote(l, 0.12, "square", 0.013, w);
        mStep++; mNext += MUSIC_SPB;
      }
    }, 100);
  }

  /* ---- state ---- */
  const SAVE_KEY = "neonSnakeBest_v1";
  let best = parseInt(localStorage.getItem(SAVE_KEY) || "0", 10) || 0;

  const COLS = 17;
  let ROWS = 24, cell = 20, boardX = 0, boardY = 0;
  function layout() {
    const availH = H - 110;
    cell = Math.floor(Math.min(W * 0.96 / COLS, availH / 24));
    ROWS = Math.max(20, Math.floor(availH / cell));
    boardX = Math.floor((W - COLS * cell) / 2);
    boardY = Math.floor(H - 20 - ROWS * cell);
  }

  let mode = "menu";       // menu | play | over
  let snake = [];          // [{x,y}], head first
  let dir = { x: 1, y: 0 };
  let dirQueue = [];
  let food = { x: 5, y: 5 };
  let score = 0;
  let stepMs = 160, acc = 0;
  let particles = [];
  let shake = 0, flash = 0, overTimer = 0;
  let pulse = 0;

  const hud = document.getElementById("hud");
  const scoreEl = document.getElementById("scoreEl"), bestEl = document.getElementById("bestEl");

  function placeFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!snake.some((s) => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function startGame() {
    ensureAudio();
    startMusic();
    layout();
    const cy = Math.floor(ROWS / 2);
    snake = [{ x: 8, y: cy }, { x: 7, y: cy }, { x: 6, y: cy }];
    dir = { x: 1, y: 0 };
    dirQueue = [];
    score = 0; stepMs = 160; acc = 0;
    particles = []; shake = 0; flash = 0;
    placeFood();
    mode = "play";
    document.getElementById("menu").classList.add("hidden");
    document.getElementById("gameover").classList.add("hidden");
    hud.classList.remove("hidden");
    scoreEl.textContent = "0";
    bestEl.textContent = "BEST " + best;
  }

  function queueDir(nx, ny) {
    if (mode !== "play") return;
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (nx === -last.x && ny === -last.y) return;  // no reversing
    if (nx === last.x && ny === last.y) return;
    if (dirQueue.length < 2) { dirQueue.push({ x: nx, y: ny }); sfx.turn(); }
  }

  function die() {
    mode = "over";
    overTimer = 0.9;
    shake = 12; flash = 0.8;
    sfx.die(); buzz([70, 40, 160]);
  }

  function stepSnake() {
    if (dirQueue.length) dir = dirQueue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
    if (snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) return die();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      stepMs = Math.max(72, stepMs - 2.6);
      sfx.eat(score); buzz(12);
      const fx = boardX + food.x * cell + cell / 2, fy = boardY + food.y * cell + cell / 2;
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * Math.PI * 2, s = 50 + Math.random() * 110;
        particles.push({ x: fx, y: fy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, hue: 140 + Math.random() * 60 });
      }
      placeFood();
    } else {
      snake.pop();
    }
  }

  /* ---- input ---- */
  let tx = 0, ty = 0;
  window.addEventListener("touchstart", (e) => {
    ensureAudio();
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  window.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 1 : -1, 0);
    else queueDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });
  window.addEventListener("keydown", (e) => {
    ensureAudio();
    if (e.key === "ArrowLeft" || e.key === "a") queueDir(-1, 0);
    else if (e.key === "ArrowRight" || e.key === "d") queueDir(1, 0);
    else if (e.key === "ArrowUp" || e.key === "w") queueDir(0, -1);
    else if (e.key === "ArrowDown" || e.key === "s") queueDir(0, 1);
  });

  /* ---- drawing ---- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0c1c2c");
    g.addColorStop(1, "#081019");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // board
    ctx.fillStyle = "rgba(0,0,0,.35)";
    rr(boardX - 6, boardY - 6, COLS * cell + 12, ROWS * cell + 12, 14);
    ctx.fill();
    ctx.strokeStyle = "rgba(61,220,132,.35)";
    ctx.lineWidth = 2;
    rr(boardX - 6, boardY - 6, COLS * cell + 12, ROWS * cell + 12, 14);
    ctx.stroke();
    // grid dots
    ctx.fillStyle = "rgba(255,255,255,.05)";
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
      ctx.fillRect(boardX + c * cell + cell / 2, boardY + r * cell + cell / 2, 1.5, 1.5);

    // food
    pulse += 0.1;
    const fx = boardX + food.x * cell + cell / 2, fy = boardY + food.y * cell + cell / 2;
    const fr = cell * 0.32 * (1 + Math.sin(pulse) * 0.12);
    ctx.shadowColor = "#ffd166";
    ctx.shadowBlur = 16;
    const fg = ctx.createRadialGradient(fx - 2, fy - 2, 1, fx, fy, fr + 2);
    fg.addColorStop(0, "#fff3c4");
    fg.addColorStop(0.6, "#ffd166");
    fg.addColorStop(1, "#e0892b");
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(fx, fy, fr, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;

    // snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(snake.length - 1, 1);
      const hue = 145 - t * 35;
      const pad = 1.5 + t * 1.8;
      ctx.fillStyle = `hsl(${hue}, 75%, ${55 - t * 18}%)`;
      if (i === 0) { ctx.shadowColor = "#3ddc84"; ctx.shadowBlur = 14; }
      rr(boardX + s.x * cell + pad, boardY + s.y * cell + pad, cell - pad * 2, cell - pad * 2, (cell - pad * 2) * 0.32);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    // eyes on head
    if (snake.length) {
      const h = snake[0];
      const cx = boardX + h.x * cell + cell / 2, cy = boardY + h.y * cell + cell / 2;
      const ex = dir.x * cell * 0.16, ey = dir.y * cell * 0.16;
      const px = dir.y * cell * 0.16, py = dir.x * cell * 0.16;
      ctx.fillStyle = "#06250f";
      ctx.beginPath(); ctx.arc(cx + ex + px, cy + ey + py, cell * 0.08, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + ex - px, cy + ey - py, cell * 0.08, 0, 7); ctx.fill();
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = `hsl(${p.hue}, 80%, 60%)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 80, 80, ${flash * 0.4})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ---- loop ---- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (mode === "play") {
      acc += dt * 1000;
      while (acc >= stepMs && mode === "play") { acc -= stepMs; stepSnake(); }
    }
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.95; p.vy *= 0.95;
      p.life -= dt;
    }
    particles = particles.filter((p) => p.life > 0);
    if (mode === "over" && overTimer > 0) {
      overTimer -= dt;
      if (overTimer <= 0) showGameOver();
    }
    shake = Math.max(0, shake - dt * 28);
    flash = Math.max(0, flash - dt * 1.8);
    draw();
    requestAnimationFrame(frame);
  }

  function showGameOver() {
    if (score > best) {
      best = score;
      localStorage.setItem(SAVE_KEY, String(best));
      document.getElementById("newBest").classList.remove("hidden");
    } else document.getElementById("newBest").classList.add("hidden");
    const earned = score * 4;
    const bal = walletAdd(earned);
    document.getElementById("walletLine").textContent = "+🪙 " + earned + " earned · Wallet " + bal.toLocaleString("en-US");
    document.getElementById("finalScore").textContent = score;
    bestEl.textContent = "BEST " + best;
    document.getElementById("gameover").classList.remove("hidden");
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);

  layout();
  bestEl.textContent = "BEST " + best;
  requestAnimationFrame(frame);

  // debug/testing hook
  window.__snake = {
    get mode() { return mode; },
    get snake() { return snake; },
    get food() { return food; },
    get score() { return score; },
    get dims() { return { COLS, ROWS }; },
    startGame, stepSnake, queueDir,
    setFood(x, y) { food = { x, y }; },
    setDir(x, y) { dir = { x, y }; dirQueue = []; },
  };
})();
</script>
</body>
</html>
