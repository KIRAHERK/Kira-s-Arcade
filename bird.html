<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0a24">
<title>Glow Bird 🐦</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #0d0a24; }
  body { font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }

  .hud {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 5;
    color: #fff;
    text-shadow: 0 0 18px rgba(77, 195, 255, .8), 0 2px 8px rgba(0,0,0,.5);
  }
  .hud .score { font-size: 56px; font-weight: 900; line-height: 1; }
  .hud .best { font-size: 13px; font-weight: 700; opacity: .75; margin-top: 2px; }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(8, 5, 22, 0.6);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .panel {
    width: min(88vw, 340px);
    background: linear-gradient(180deg, #221a4a, #120d2e);
    border: 1px solid rgba(77, 195, 255, .55);
    border-radius: 22px;
    padding: 26px 22px;
    text-align: center;
    color: #fff;
    box-shadow: 0 16px 50px rgba(0,0,0,.55), 0 0 40px rgba(77,195,255,.15);
    animation: pop .35s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .panel h1 {
    font-size: 30px; letter-spacing: 1px; margin-bottom: 6px;
    background: linear-gradient(180deg, #d8f4ff, #4dc3ff 55%, #ff3d8b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel .tag { font-size: 13.5px; opacity: .8; margin-bottom: 18px; line-height: 1.6; }
  .panel .result { font-size: 15px; margin-bottom: 16px; line-height: 1.8; }
  .panel .result b { color: #4dc3ff; font-size: 30px; }
  .newbest { color: #3ddc84; font-weight: 800; }
  .big-btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    font-size: 18px; font-weight: 800; letter-spacing: 2px;
    color: #03222e;
    background: linear-gradient(180deg, #a8e6ff, #4dc3ff 55%, #1f86c7);
    box-shadow: 0 5px 0 #0f4a73;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0f4a73; }
  .links { margin-top: 14px; font-size: 13px; }
  .links a { color: rgba(255,255,255,.65); text-decoration: underline; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
  <div class="score" id="scoreEl">0</div>
  <div class="best" id="bestEl">BEST 0</div>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>🐦 GLOW BIRD</h1>
    <div class="tag">Tap to flap. Thread the neon gates.<br>Don't touch <b>anything</b>.</div>
    <button class="big-btn" id="startBtn">TAP TO FLY</button>
    <div class="links">
      <a href="index.html">🏠 All games</a>
    </div>
  </div>
</div>

<div class="overlay hidden" id="gameover">
  <div class="panel">
    <h1>💫 CLIPPED!</h1>
    <div class="result">
      Gates <b id="finalScore">0</b>
      <div class="newbest hidden" id="newBest">★ NEW BEST! ★</div>
      <div id="walletLine" style="margin-top:6px;color:#ffd166;font-size:14px;font-weight:700;"></div>
    </div>
    <button class="big-btn" id="retryBtn">FLY AGAIN</button>
    <div class="links">
      <a href="index.html">🏠 All games</a>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ---- audio ---- */
  let actx = null;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === "suspended") actx.resume();
  }
  function tone(f1, f2, dur, type, vol, when = 0) {
    if (!actx) return;
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    flap: () => tone(500, 800, 0.08, "sine", 0.05),
    gate: () => tone(880, 1320, 0.1, "triangle", 0.05),
    die: () => { tone(400, 60, 0.45, "sawtooth", 0.08); tone(200, 50, 0.5, "square", 0.05); },
  };
  const buzz = (p) => { if (navigator.vibrate) navigator.vibrate(p); };

  /* ---- background music ---- */
  const MUSIC_BASS = [147, 0, 147, 0, 175, 0, 165, 0];
  const MUSIC_LEAD = [587, 0, 659, 698, 0, 784, 0, 659, 587, 0, 523, 0, 587, 0, 0, 0];
  const MUSIC_SPB = 0.14;
  let mStep = 0, mNext = 0, mTimer = null;
  function mNote(f, dur, type, vol, when) {
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function startMusic() {
    ensureAudio();
    if (mTimer || !actx) return;
    mStep = 0; mNext = actx.currentTime + 0.1;
    mTimer = setInterval(() => {
      if (!actx) return;
      while (mNext < actx.currentTime + 0.35) {
        const w = Math.max(0, mNext - actx.currentTime);
        const b = MUSIC_BASS[mStep % MUSIC_BASS.length];
        const l = MUSIC_LEAD[mStep % MUSIC_LEAD.length];
        if (b) mNote(b, 0.2, "triangle", 0.032, w);
        if (l) mNote(l, 0.12, "square", 0.012, w);
        mStep++; mNext += MUSIC_SPB;
      }
    }, 100);
  }


  /* ---- state ---- */
  const SAVE_KEY = "glowBirdBest_v1";
  /* ---- shared arcade wallet ---- */
  const WALLET_KEY = "luckySpinSave_v1";
  function walletAdd(n) {
    let s = { balance: 1000, betIndex: 1, spins: 0, biggestWin: 0 };
    try { const j = JSON.parse(localStorage.getItem(WALLET_KEY)); if (j && typeof j.balance === "number") s = Object.assign(s, j); } catch (e) {}
    s.balance += n;
    localStorage.setItem(WALLET_KEY, JSON.stringify(s));
    return s.balance;
  }

  let best = parseInt(localStorage.getItem(SAVE_KEY) || "0", 10) || 0;
  const R = 15;             // bird radius
  const PW = 72;            // gate width
  const G = 1250, FLAP = -400;

  let mode = "menu";        // menu | play | over
  let bird = { y: 0, vy: 0 };
  let pipes = [];           // {x, gapY, gapH, passed, hue}
  let trail = [];
  let score = 0;
  let overTimer = 0, shake = 0, flash = 0;
  let wing = 0;             // wing animation phase

  const hud = document.getElementById("hud");
  const scoreEl = document.getElementById("scoreEl"), bestEl = document.getElementById("bestEl");
  const groundY = () => H - 70;

  function startGame() {
    ensureAudio();
    startMusic();
    bird = { y: H * 0.45, vy: 0 };
    pipes = [];
    trail = [];
    score = 0; shake = 0; flash = 0;
    mode = "play";
    document.getElementById("menu").classList.add("hidden");
    document.getElementById("gameover").classList.add("hidden");
    hud.classList.remove("hidden");
    scoreEl.textContent = "0";
    bestEl.textContent = "BEST " + best;
    flap();
  }

  function flap() {
    if (mode !== "play") return;
    bird.vy = FLAP;
    wing = 1;
    sfx.flap(); buzz(8);
  }

  function spawnPipe() {
    const gapH = Math.max(150, 195 - score * 1.5);
    const margin = 90;
    const gapY = margin + Math.random() * (groundY() - gapH - margin * 2);
    pipes.push({ x: W + 40, gapY, gapH, passed: false, hue: (190 + score * 14) % 360 });
  }

  function die() {
    mode = "over";
    overTimer = 1.0;
    shake = 14; flash = 0.8;
    sfx.die(); buzz([70, 40, 160]);
  }

  function birdX() { return W * 0.3; }

  function update(dt) {
    if (mode === "play" || mode === "over") {
      bird.vy += G * dt;
      bird.y += bird.vy * dt;
      if (bird.y < R) { bird.y = R; bird.vy = Math.max(bird.vy, 0); }
      if (bird.y + R > groundY()) {
        bird.y = groundY() - R;
        if (mode === "play") die();
        bird.vy = 0;
      }
    }
    if (mode !== "play") return;

    const speed = Math.min(165 + score * 2.5, 270);
    for (const p of pipes) p.x -= speed * dt;
    if (!pipes.length || pipes[pipes.length - 1].x < W - 235) spawnPipe();
    pipes = pipes.filter((p) => p.x + PW > -30);

    const bx = birdX();
    for (const p of pipes) {
      if (!p.passed && p.x + PW < bx - R) {
        p.passed = true;
        score++;
        scoreEl.textContent = score;
        sfx.gate(); buzz(10);
      }
      if (bx + R > p.x && bx - R < p.x + PW &&
          (bird.y - R < p.gapY || bird.y + R > p.gapY + p.gapH)) {
        die();
        break;
      }
    }

    trail.unshift({ x: bx, y: bird.y });
    if (trail.length > 12) trail.pop();
  }

  /* ---- drawing ---- */
  function draw() {
    // night sky
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a0726");
    g.addColorStop(0.7, "#1b1140");
    g.addColorStop(1, "#311a52");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // stars
    ctx.fillStyle = "rgba(255,255,255,.5)";
    for (let i = 0; i < 30; i++) ctx.fillRect((i * 487) % W, (i * 271) % (H * 0.8), 2, 2);
    // distant skyline
    ctx.fillStyle = "rgba(20, 14, 50, .9)";
    for (let i = 0; i < 10; i++) {
      const bw = W / 10;
      const bh = 40 + ((i * 53) % 80);
      ctx.fillRect(i * bw, groundY() - bh, bw - 6, bh);
    }

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // gates
    for (const p of pipes) {
      const grad = ctx.createLinearGradient(p.x, 0, p.x + PW, 0);
      grad.addColorStop(0, `hsl(${p.hue}, 90%, 38%)`);
      grad.addColorStop(0.5, `hsl(${p.hue}, 95%, 60%)`);
      grad.addColorStop(1, `hsl(${p.hue}, 90%, 38%)`);
      ctx.fillStyle = grad;
      ctx.shadowColor = `hsl(${p.hue}, 95%, 60%)`;
      ctx.shadowBlur = 18;
      ctx.fillRect(p.x, 0, PW, p.gapY);
      ctx.fillRect(p.x, p.gapY + p.gapH, PW, groundY() - p.gapY - p.gapH);
      ctx.shadowBlur = 0;
      // gate lips
      ctx.fillStyle = `hsl(${p.hue}, 95%, 75%)`;
      ctx.fillRect(p.x - 4, p.gapY - 12, PW + 8, 12);
      ctx.fillRect(p.x - 4, p.gapY + p.gapH, PW + 8, 12);
    }

    // ground
    ctx.fillStyle = "#241646";
    ctx.fillRect(0, groundY(), W, H - groundY());
    ctx.fillStyle = "rgba(77, 195, 255, .5)";
    ctx.fillRect(0, groundY(), W, 3);

    // trail
    for (let i = trail.length - 1; i >= 0; i--) {
      const t = trail[i];
      const a = (1 - i / trail.length) * 0.25;
      ctx.fillStyle = `rgba(77, 195, 255, ${a})`;
      ctx.beginPath();
      ctx.arc(t.x - i * 6, t.y, R * (1 - i / trail.length * 0.6), 0, 7);
      ctx.fill();
    }

    // bird
    if (mode !== "menu") {
      const bx = birdX();
      const rot = Math.max(-0.5, Math.min(0.9, bird.vy / 600));
      ctx.save();
      ctx.translate(bx, bird.y);
      ctx.rotate(rot);
      ctx.shadowColor = "#4dc3ff";
      ctx.shadowBlur = 22;
      const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, R + 2);
      bodyGrad.addColorStop(0, "#d8f4ff");
      bodyGrad.addColorStop(0.6, "#4dc3ff");
      bodyGrad.addColorStop(1, "#1f86c7");
      ctx.fillStyle = bodyGrad;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      // wing
      wing = Math.max(0, wing - 0.08);
      ctx.fillStyle = "#bfeaff";
      ctx.beginPath();
      ctx.ellipse(-4, 2, 9, 5 + wing * 6, -0.5 - wing * 0.8, 0, 7);
      ctx.fill();
      // eye + beak
      ctx.fillStyle = "#0d2433";
      ctx.beginPath(); ctx.arc(6, -4, 3, 0, 7); ctx.fill();
      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.moveTo(R - 2, -2); ctx.lineTo(R + 8, 1); ctx.lineTo(R - 2, 5);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 80, 120, ${flash * 0.45})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    if (mode === "over" && overTimer > 0) {
      overTimer -= dt;
      if (overTimer <= 0) showGameOver();
    }
    shake = Math.max(0, shake - dt * 28);
    flash = Math.max(0, flash - dt * 1.8);
    draw();
    requestAnimationFrame(frame);
  }

  function showGameOver() {
    if (score > best) {
      best = score;
      localStorage.setItem(SAVE_KEY, String(best));
      document.getElementById("newBest").classList.remove("hidden");
    } else document.getElementById("newBest").classList.add("hidden");
    const earned = score * 8;
    const wbal = walletAdd(earned);
    document.getElementById("walletLine").textContent = "+\u{1FA99} " + earned + " earned \u00b7 Wallet " + wbal.toLocaleString("en-US");
    document.getElementById("finalScore").textContent = score;
    bestEl.textContent = "BEST " + best;
    document.getElementById("gameover").classList.remove("hidden");
  }

  window.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest(".panel")) return;
    if (mode === "play") { ensureAudio(); flap(); }
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "ArrowUp") { ensureAudio(); if (mode === "play") flap(); }
  });
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);

  bestEl.textContent = "BEST " + best;
  requestAnimationFrame(frame);

  // debug/testing hook
  window.__bird = {
    get mode() { return mode; },
    get bird() { return bird; },
    get pipes() { return pipes; },
    get score() { return score; },
    flap, startGame,
    setBirdY(y) { bird.y = y; },
  };
})();
</script>
</body>
</html>
